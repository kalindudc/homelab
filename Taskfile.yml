---
version: "3"

vars:
  KUBERNETES_DIR: "{{.ROOT_DIR}}/src/kubernetes"
  ANSIBLE_DIR: "{{.ROOT_DIR}}/src/ansible"
  TERRAFORM_DIR: "{{.ROOT_DIR}}/src/terraform"

dotenv: [".env"]

env:
  KUBECONFIG: "~/.kube/homelab.config"

tasks:

  init:
    desc: Initialize workstation dependencies
    cmds:
      - scripts/init.sh

  sync_known_hosts:
    desc: Add all servers to known-hosts
    cmds:
      - cat src/known_hosts.txt | xargs -I {} ssh-keyscan {} >> ~/.ssh/known_hosts

  sync_hass:
    desc: Call sync_hass ansible playbook
    cmds:
      - ansible-playbook -i src/ansible/inventory/hass.ini src/ansible/playbooks/sync_hass.yml

  edit_vault:
    desc: Edit ansible vault
    cmds:
      - ansible-vault edit src/ansible/playbooks/vault.yml

  view_vault:
    desc: View ansible vault
    cmds:
      - ansible-vault view src/ansible/playbooks/vault.yml

  k3s:
    desc: Kubernetes cluster lifecycle (pass --init, --deploy, --upgrade, --kubeconfig)
    cmds:
      - scripts/k8s.sh {{.CLI_ARGS}}

  jellyfin_deploy:
    desc: Deploy Jellyfin to the k3s cluster (namespace media)
    cmds:
      - kubectl apply -k {{.ROOT_DIR}}/src/kubernetes/jellyfin/

  jellyfin_status:
    desc: Show Jellyfin pod and service status
    cmds:
      - kubectl -n media get pods,svc -l app=jellyfin -o wide

  jellyfin_remove:
    desc: Remove Jellyfin from the cluster (data on the node is kept)
    cmds:
      - kubectl delete -k {{.ROOT_DIR}}/src/kubernetes/jellyfin/
