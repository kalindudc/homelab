apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
  labels:
    app: jellyfin
  annotations:
    # Pin the MetalLB address so a stable DNS record can point at it,
    # e.g. jellyfin.lab.home.arpa -> 10.0.0.200
    metallb.universe.tf/loadBalancerIPs: 10.0.0.200
spec:
  type: LoadBalancer
  selector:
    app: jellyfin
  ports:
    - name: http
      port: 8096
      targetPort: http
      protocol: TCP
